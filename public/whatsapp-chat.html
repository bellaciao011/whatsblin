<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>WhatsApp</title>
  <meta name="theme-color" content="#202c33">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <link rel="icon" href="https://static.whatsapp.net/rsrc.php/v3/yP/r/rNqzzdltrash.png" type="image/png">
  <link rel="stylesheet" href="/css/whatsapp-chat.css?v=20260917_v2">
  
  <!-- PIXEL_SCRIPTS_PLACEHOLDER -->
</head>
<body>

  <div class="wa-app-container">
    <!-- Fundo de Wallpaper Original WhatsApp -->
    <div class="wa-wallpaper-layer"></div>
    <!-- Cabeçalho Oficial WhatsApp -->
    <header class="wa-header">
      <div class="wa-header-left">
        <button type="button" class="wa-back-btn" aria-label="Volver">‹</button>
        <div class="wa-avatar-wrap">
          <img id="wa-user-avatar" src="https://pps.whatsapp.net/v/t61.24694-24/813733428_1659309575529240_7059521085506520943_n.jpg?ccb=11-4&oh=01_Q5Aa5gF-J4FlH_Qp6Hw86K6kJbV6zf-_6llpJ4Uj1LmFt9T_IA&oe=6AB8CB65&_nc_sid=5e03e0&_nc_cat=111" alt="Foto de perfil" class="wa-avatar" onerror="this.src='https://ui-avatars.com/api/?name=Maria+Carvalho&background=00a884&color=fff';" />
          <span class="wa-online-dot"></span>
        </div>
        <div class="wa-user-info">
          <div class="wa-user-name">
            <span id="wa-user-name">Maria Carvalho</span>
            <span class="wa-verified-badge" title="Cuenta Verificada">✓</span>
          </div>
          <div id="wa-user-status" class="wa-user-status">en línea</div>
        </div>
      </div>

      <div class="wa-header-actions">
        <button type="button" class="wa-icon-btn" title="Videollamada">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
        </button>
        <button type="button" class="wa-icon-btn" title="Llamada">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M20.01 15.38c-1.23 0-2.42-.2-3.53-.56-.35-.12-.74-.03-1.02.24l-2.2 2.2c-2.83-1.44-5.15-3.75-6.59-6.59l2.2-2.21c.28-.26.36-.65.25-1C8.7 6.45 8.5 5.25 8.5 4c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1 0 9.39 7.61 17 17 17 .55 0 1-.45 1-1v-3.5c0-.55-.45-1-.99-1.12z"/></svg>
        </button>
        <button type="button" class="wa-icon-btn" title="Menú">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
        </button>
      </div>
    </header>

    <!-- Área de Mensagens com Doodles -->
    <main class="wa-chat-area" id="wa-chat-area">
      <!-- Aviso de Criptografia -->
      <div class="wa-encryption-notice">
        <span>🔒</span>
        <span>Los mensajes y las llamadas están cifrados de extremo a extremo. Nadie fuera de este chat, ni siquiera WhatsApp, puede leerlos ni escucharlos. Toca para obtener más información.</span>
      </div>

      <div class="wa-date-pill">HOY</div>
    </main>

    <!-- Barra de Digitação Inferior -->
    <footer class="wa-input-bar">
      <div class="wa-input-wrap">
        <button type="button" class="wa-input-icon" title="Emojis">😊</button>
        <input type="text" id="wa-input-field" class="wa-input-field" placeholder="Escribe un mensaje" autocomplete="off" />
        <button type="button" class="wa-input-icon" title="Adjuntar">📎</button>
      </div>
      <button type="button" id="wa-send-btn" class="wa-send-btn" aria-label="Enviar">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" style="transform: rotate(-30deg) translate(2px, -1px);">
          <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
        </svg>
      </button>
    </footer>
  </div>

  <!-- Modal Lightbox para Ampliar Imagem de Prova -->
  <div id="wa-modal-backdrop" class="wa-modal-backdrop" onclick="closeWaModal()">
    <button type="button" class="wa-modal-close" onclick="closeWaModal()">✕</button>
    <img id="wa-modal-img" src="" alt="Prueba ampliada" class="wa-modal-img" onclick="event.stopPropagation()">
  </div>

  <script src="/js/whatsapp-chat.js?v=20260917_v2"></script>
</body>
</html>
